:root{
  --porcelain:#F6F6F4;
  --slip:#ECEBE7;
  --slip-deep:#E1E0DB;
  --line:#D9D8D3;
  --kiln:#939598;
  --kiln-deep:#6E7073;
  --ink:#34363A;
  --celadon:#6F8F82;
  --celadon-soft:#E3EAE6;
  --iron:#9E4B36;
  --iron-soft:#F2E3DE;
  --ochre:#A7864A;
  --ochre-soft:#F1EADB;
  --white:#FFFFFF;
  --radius-s:4px;
  --radius-m:10px;
  --sidebar:272px;
  --font:'Jost','Noto Sans Thai','Leelawadee UI','Hiragino Sans','Yu Gothic',system-ui,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--porcelain);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
a{color:var(--celadon);}
:focus-visible{outline:2px solid var(--celadon);outline-offset:2px;}
::selection{background:var(--celadon-soft);}

/* ---------- Header ---------- */
.header{display:flex;align-items:center;gap:22px;padding:22px 32px 0;flex-wrap:wrap;}
.app-title{margin:0;font-weight:400;font-size:20px;letter-spacing:-0.005em;color:var(--ink);}
.header-spacer{flex:1;}
.header-actions{display:flex;gap:8px;flex-wrap:wrap;}

/* ---------- Sheet tabs: the one bold element ---------- */
.tabs{display:flex;gap:30px;padding:26px 32px 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{background:none;border:none;padding:0 0 16px;cursor:pointer;text-align:left;position:relative;white-space:nowrap;color:var(--kiln);}
.tab .t-name{display:block;font-weight:300;font-size:24px;letter-spacing:-0.01em;line-height:1.05;transition:color .15s ease;}
.tab .t-sub{display:block;font-size:12.5px;margin-top:6px;color:var(--kiln);}
.tab .t-sub b{font-weight:500;color:var(--kiln-deep);}
.tab:hover .t-name{color:var(--kiln-deep);}
.tab.active .t-name{color:var(--ink);font-weight:400;}
.tab.active::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--ink);border-radius:2px 2px 0 0;}

/* ---------- Layout ---------- */
.layout{display:grid;grid-template-columns:var(--sidebar) 1fr;min-height:calc(100vh - 170px);}
.sidebar{border-right:1px solid var(--line);padding:18px 20px 60px 32px;position:sticky;top:0;align-self:start;max-height:100vh;overflow-y:auto;scrollbar-width:thin;}
.main{padding:18px 32px 80px;min-width:0;}

/* ---------- Sidebar ---------- */
.side-block{margin-bottom:22px;}
.side-title{font-size:13px;font-weight:500;color:var(--ink);margin:0 0 8px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.side-title .mini{font-size:11.5px;font-weight:400;color:var(--kiln);background:none;border:none;cursor:pointer;padding:0;}
.side-title .mini:hover{color:var(--ink);text-decoration:underline;}
.presets{display:flex;flex-direction:column;gap:2px;}
.preset{display:flex;justify-content:space-between;align-items:center;background:none;border:none;border-radius:var(--radius-s);padding:6px 8px;margin:0 -8px;cursor:pointer;text-align:left;color:var(--ink);}
.preset:hover{background:var(--slip);}
.preset.active{background:var(--ink);color:var(--porcelain);}
.preset .n{font-size:12px;color:var(--kiln);}
.preset.active .n{color:var(--slip-deep);}
.facet{border-top:1px solid var(--line);padding-top:12px;margin-top:12px;}
.facet-head{display:flex;justify-content:space-between;align-items:center;cursor:pointer;background:none;border:none;width:100%;padding:0;text-align:left;}
.facet-head .fh-name{font-size:13px;font-weight:500;}
.facet-head .fh-chev{color:var(--kiln);font-size:11px;transition:transform .15s;}
.facet.collapsed .fh-chev{transform:rotate(-90deg);}
.facet.collapsed .facet-body{display:none;}
.facet-body{margin-top:8px;}
.facet-mode{display:flex;gap:4px;margin-bottom:6px;}
.facet-mode button{font-size:11.5px;border:1px solid var(--line);background:var(--white);border-radius:20px;padding:1px 9px;cursor:pointer;color:var(--kiln-deep);}
.facet-mode button.on{background:var(--ink);color:var(--porcelain);border-color:var(--ink);}
.facet-search{width:100%;border:1px solid var(--line);border-radius:var(--radius-s);padding:5px 8px;font-size:12.5px;background:var(--white);margin-bottom:6px;}
.opt{display:flex;align-items:center;gap:8px;padding:3px 0;cursor:pointer;font-size:13px;}
.opt input{accent-color:var(--ink);width:14px;height:14px;margin:0;flex:none;cursor:pointer;}
.opt .o-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.opt .o-n{font-size:12px;color:var(--kiln);font-variant-numeric:tabular-nums;}
.opt.zero{opacity:.45;}
.more-btn{font-size:12px;color:var(--celadon);background:none;border:none;padding:2px 0;cursor:pointer;}

/* ---------- Toolbar ---------- */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;}
.search{position:relative;flex:1 1 280px;min-width:220px;}
.search input{width:100%;height:40px;border:1px solid var(--line);border-radius:var(--radius-m);background:var(--white);padding:0 40px 0 38px;font-size:14px;}
.search input:focus{outline:none;border-color:var(--kiln);box-shadow:0 0 0 3px var(--slip);}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--kiln);}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-family:var(--font);font-size:11px;color:var(--kiln);border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--porcelain);}
.select{height:40px;border:1px solid var(--line);border-radius:var(--radius-m);background:var(--white);padding:0 10px;cursor:pointer;}
.btn{height:40px;border:1px solid var(--line);border-radius:var(--radius-m);background:var(--white);padding:0 14px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;}
.btn:hover{border-color:var(--kiln);}
.btn.primary{background:var(--ink);color:var(--porcelain);border-color:var(--ink);}
.btn.primary:hover{background:#222325;}
.btn.ghost{background:transparent;}
.btn.small{height:30px;padding:0 10px;font-size:12.5px;border-radius:var(--radius-s);}
.btn.danger{color:var(--iron);border-color:var(--iron-soft);}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius-m);overflow:hidden;background:var(--white);height:40px;}
.seg button{border:none;background:none;padding:0 12px;cursor:pointer;color:var(--kiln-deep);}
.seg button.on{background:var(--slip);color:var(--ink);font-weight:500;}
.filters-toggle{display:none;}

.summary{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:30px;margin-bottom:12px;}
.summary .count{font-size:13.5px;color:var(--kiln-deep);margin-right:4px;}
.summary .count b{color:var(--ink);font-weight:500;}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--slip);border-radius:20px;padding:3px 6px 3px 11px;font-size:12.5px;}
.chip .c-k{color:var(--kiln-deep);}
.chip button{border:none;background:none;cursor:pointer;color:var(--kiln-deep);font-size:15px;line-height:1;padding:0 3px;border-radius:50%;}
.chip button:hover{color:var(--ink);background:var(--slip-deep);}
.clear-all{font-size:12.5px;color:var(--iron);background:none;border:none;cursor:pointer;}
.selbar{display:none;align-items:center;gap:10px;background:var(--ink);color:var(--porcelain);border-radius:var(--radius-m);padding:8px 10px 8px 16px;margin-bottom:12px;}
.selbar.show{display:flex;}
.selbar .btn{height:32px;background:transparent;color:var(--porcelain);border-color:#55575b;}
.selbar .btn:hover{border-color:var(--porcelain);}
.selbar .grow{flex:1;}
.selbar{flex-wrap:wrap;}
.selcount{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.sel-total{margin-right:4px;}
.sel-total b{font-weight:600;}
.selpill{border:1px solid #55575b;background:transparent;color:var(--slip-deep);border-radius:20px;padding:2px 10px;font-size:12.5px;cursor:pointer;}
.selpill b{color:var(--porcelain);font-weight:600;margin-left:3px;}
.selpill.here{border-color:var(--porcelain);color:var(--porcelain);}
.selpill:hover{border-color:var(--porcelain);}
.selbar .btn.sel-primary{background:var(--porcelain);color:var(--ink);border-color:var(--porcelain);}
.selbar .btn:disabled{opacity:.4;cursor:not-allowed;}

/* ---------- Table ---------- */
.table-wrap{background:var(--white);border:1px solid var(--line);border-radius:var(--radius-m);overflow-x:auto;}
table{width:100%;border-collapse:collapse;min-width:820px;}
thead th{position:sticky;top:0;background:var(--white);text-align:left;font-weight:500;font-size:12.5px;color:var(--kiln-deep);padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1;}
thead th.sortable{cursor:pointer;}
thead th.sortable:hover{color:var(--ink);}
thead th .arr{color:var(--ink);margin-left:4px;}
tbody tr{border-bottom:1px solid var(--slip);cursor:pointer;}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:#FAFAF8;}
tbody tr.selected{background:#F1F4F2;box-shadow:inset 3px 0 0 var(--celadon);}
tbody td{padding:10px 12px;vertical-align:top;font-size:13.5px;}
td.chk,th.chk{width:40px;padding-right:0;}
td.chk input,th.chk input{accent-color:var(--ink);width:15px;height:15px;cursor:pointer;margin:3px 0 0;}
.who{display:flex;gap:11px;align-items:flex-start;min-width:200px;}
.who .w-name{font-weight:500;line-height:1.3;}
.who .w-sub{font-size:12.5px;color:var(--kiln);margin-top:1px;}
.stack{display:flex;flex-direction:column;gap:2px;}
.muted{color:var(--kiln);}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}
.small{font-size:12.5px;}
.num{font-variant-numeric:tabular-nums;}
.more{color:var(--kiln);font-size:12px;}
.lnk{color:var(--celadon);text-decoration:none;}
.lnk:hover{text-decoration:underline;}
.clip{max-width:260px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.row-actions{display:flex;gap:4px;justify-content:flex-end;}
td.act,th.act{position:sticky;right:0;background:var(--white);width:84px;box-shadow:-8px 0 8px -8px rgba(0,0,0,.12);}
tbody tr:hover td.act{background:#FAFAF8;}
tbody tr.selected td.act{background:#F1F4F2;}
.iconbtn{width:30px;height:30px;border:1px solid var(--line);background:var(--white);border-radius:var(--radius-s);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--kiln-deep);}
.iconbtn:hover{color:var(--ink);border-color:var(--kiln);}
.iconbtn:disabled{opacity:.35;cursor:not-allowed;}

/* tags */
.tag{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:20px;background:var(--slip);color:var(--kiln-deep);margin:2px 5px 2px 0;white-space:nowrap;}
.tag.celadon{background:var(--celadon-soft);color:#4B6A5D;}
.tag.ochre{background:var(--ochre-soft);color:#7D6230;}
.tag.iron{background:var(--iron-soft);color:var(--iron);}
.tag.solid-iron{background:var(--iron);color:#fff;}
.tag.ink{background:var(--ink);color:var(--porcelain);}
.tag.link{cursor:pointer;border:none;font-family:inherit;}
.tag.link:hover{filter:brightness(.95);text-decoration:underline;}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px;}

/* avatar */
.av{position:relative;width:36px;height:36px;border-radius:50%;flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center;font-weight:500;font-size:13px;color:var(--white);}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--white);}
.av img[data-logo="1"]{object-fit:contain;padding:12%;}
.av:has(img[data-logo="1"]){box-shadow:inset 0 0 0 1px var(--line);}
.av.xl{width:88px;height:88px;font-size:28px;font-weight:400;}
.av.edit{cursor:pointer;}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;}
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius-m);padding:14px 14px 12px;cursor:pointer;position:relative;display:flex;flex-direction:column;gap:8px;}
.card:hover{border-color:var(--kiln);}
.card.selected{border-color:var(--celadon);box-shadow:0 0 0 2px var(--celadon-soft);}
.card .c-top{display:flex;gap:11px;align-items:flex-start;padding-right:22px;}
.card .c-chk{position:absolute;top:14px;right:14px;accent-color:var(--ink);width:15px;height:15px;}
.card .kv{display:grid;grid-template-columns:70px 1fr;gap:3px 8px;font-size:12.5px;}
.card .kv span:nth-child(odd){color:var(--kiln);}
.card .kv span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.card .c-foot{display:flex;gap:6px;margin-top:auto;}

.empty{padding:70px 20px;text-align:center;}
.empty .e-title{font-size:18px;font-weight:400;margin-bottom:4px;}
.empty p{color:var(--kiln-deep);margin:0 0 14px;}

/* ---------- Drawer & modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(40,41,44,.32);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;}
.scrim.open{opacity:1;pointer-events:auto;}
.drawer{position:fixed;top:0;right:0;height:100%;width:520px;max-width:100vw;background:var(--porcelain);z-index:41;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.12);}
.drawer.open{transform:none;}
.d-head{padding:20px 24px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);}
.d-head h2{margin:0;font-weight:400;font-size:22px;}
.d-body{flex:1;overflow-y:auto;padding:18px 24px 30px;}
.d-foot{padding:14px 24px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:center;background:var(--porcelain);}
.d-foot .right{display:flex;gap:8px;}
.closex{width:34px;height:34px;border:none;background:none;border-radius:50%;cursor:pointer;font-size:20px;color:var(--kiln-deep);}
.closex:hover{background:var(--slip);}
.fgroup{margin-bottom:20px;}
.fgroup-title{font-size:13px;font-weight:500;margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line);}
.f{margin-bottom:12px;}
.f label{display:block;font-size:12.5px;color:var(--kiln-deep);margin-bottom:4px;}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--white);padding:8px 10px;font-size:14px;}
.f textarea{min-height:64px;resize:vertical;line-height:1.45;}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--kiln);box-shadow:0 0 0 3px var(--slip);}
.f .hint{font-size:11.5px;color:var(--kiln);margin-top:3px;}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.rep{display:flex;gap:6px;margin-bottom:6px;align-items:center;}
.rep input,.rep select{border:1px solid var(--line);border-radius:var(--radius-s);background:var(--white);padding:7px 9px;font-size:13.5px;min-width:0;}
.rep .r-lab{flex:0 0 118px;}
.rep .r-val{flex:1;}
.rep .x{border:none;background:none;color:var(--kiln);cursor:pointer;font-size:18px;width:26px;flex:none;border-radius:50%;}
.rep .x:hover{color:var(--iron);background:var(--iron-soft);}
.addrow{border:1px dashed var(--kiln);background:none;color:var(--kiln-deep);border-radius:var(--radius-s);padding:6px 10px;cursor:pointer;font-size:12.5px;width:100%;}
.addrow:hover{border-color:var(--ink);color:var(--ink);}
.taginput{display:flex;flex-wrap:wrap;gap:5px;border:1px solid var(--line);background:var(--white);border-radius:var(--radius-s);padding:6px;}
.taginput .tg{background:var(--slip);border-radius:20px;padding:2px 4px 2px 10px;font-size:12.5px;display:inline-flex;align-items:center;gap:3px;}
.taginput .tg button{border:none;background:none;cursor:pointer;color:var(--kiln-deep);font-size:14px;}
.taginput input{border:none;outline:none;flex:1;min-width:120px;padding:2px 4px;font-size:13.5px;}
.avatar-edit{display:flex;gap:14px;align-items:center;margin-bottom:18px;}
.note-box{background:var(--white);border:1px solid var(--line);border-radius:var(--radius-s);padding:9px 11px;font-size:13px;color:var(--kiln-deep);margin-bottom:12px;}
.warn-box{background:var(--iron-soft);border-radius:var(--radius-s);padding:9px 12px;font-size:13px;color:#6F3526;margin-bottom:14px;}
.warn-box ul{margin:4px 0 0;padding-left:18px;}

.modal-scrim{position:fixed;inset:0;background:rgba(40,41,44,.4);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;opacity:0;pointer-events:none;transition:opacity .2s;overflow-y:auto;}
.modal-scrim.open{opacity:1;pointer-events:auto;}
.modal{background:var(--porcelain);width:560px;max-width:100%;border-radius:14px;box-shadow:0 30px 70px rgba(0,0,0,.25);position:relative;}
.m-head{padding:26px 28px 18px;display:flex;gap:18px;align-items:center;border-bottom:1px solid var(--line);}
.m-head h2{margin:0 0 3px;font-weight:400;font-size:24px;line-height:1.15;}
.m-head .m-sub{color:var(--kiln-deep);font-size:13.5px;}
.m-head .closex{position:absolute;top:12px;right:12px;}
.m-body{padding:18px 28px 8px;}
.m-sec{margin-bottom:18px;}
.m-sec h3{font-size:13px;font-weight:500;margin:0 0 8px;color:var(--ink);}
.m-list{display:flex;flex-direction:column;gap:6px;}
.m-item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--white);border:1px solid var(--line);border-radius:var(--radius-s);padding:8px 12px;font-size:13.5px;}
.m-item a{color:var(--ink);text-decoration:none;font-weight:500;word-break:break-all;}
.m-item a:hover{color:var(--celadon);text-decoration:underline;}
.m-item .p{font-size:12px;color:var(--kiln);white-space:nowrap;}
.m-item .copy{border:none;background:none;color:var(--kiln);cursor:pointer;font-size:12px;}
.m-item .copy:hover{color:var(--ink);}
.m-text{font-size:13.5px;line-height:1.55;white-space:pre-line;}
.m-grid{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:13.5px;}
.m-grid .k{color:var(--kiln-deep);}
details.jp summary{cursor:pointer;font-size:12.5px;color:var(--kiln-deep);margin-top:6px;}
details.jp .m-text{margin-top:6px;color:var(--kiln-deep);}
.m-foot{padding:14px 28px 24px;display:flex;gap:8px;justify-content:flex-end;}

.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);background:var(--ink);color:var(--porcelain);padding:10px 18px;border-radius:var(--radius-m);font-size:13.5px;opacity:0;pointer-events:none;transition:all .2s;z-index:70;}
.toast.show{opacity:1;transform:translate(-50%,0);}

.gate{position:fixed;inset:0;background:var(--porcelain);z-index:90;display:flex;align-items:center;justify-content:center;padding:20px;}
.gate.hidden{display:none;}
.gate-card{width:380px;max-width:100%;background:var(--white);border:1px solid var(--line);border-radius:14px;padding:30px 28px;box-shadow:0 20px 50px rgba(0,0,0,.06);}
.gate-title{margin:0 0 6px;font-weight:400;font-size:24px;}
.gate-card .f{margin:14px 0 0;}
.gate-card .btn{width:100%;justify-content:center;margin-top:16px;}
.gate-msg{margin-top:12px;font-size:13px;}
.gate-msg.err{color:var(--iron);}
.gate-msg.ok{color:#4B6A5D;}
.gate-link{background:none;border:none;color:var(--celadon);cursor:pointer;padding:0;font-size:13px;margin-top:12px;}
.who-am-i{font-size:12.5px;color:var(--kiln-deep);align-self:center;margin-right:4px;}
.edited{font-size:12px;color:var(--kiln);margin-right:auto;align-self:center;}
.conflict{background:var(--ochre-soft);color:#6B5227;border-radius:var(--radius-s);padding:10px 12px;font-size:13px;margin-bottom:14px;}
.conflict .btn{height:30px;margin:8px 8px 0 0;font-size:12.5px;}
@media (max-width:980px){
  .layout{grid-template-columns:1fr;}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:320px;max-width:88vw;max-height:none;background:var(--porcelain);z-index:45;transform:translateX(-100%);transition:transform .25s;padding:20px;box-shadow:10px 0 40px rgba(0,0,0,.12);}
  .sidebar.open{transform:none;}
  .filters-toggle{display:inline-flex;}
  .header,.tabs,.main{padding-left:18px;padding-right:18px;}
  .tab .t-name{font-size:24px;}
  .tabs{gap:26px;}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;}}
@media print{.sidebar,.toolbar,.header-actions,.row-actions,.chk,.selbar{display:none!important;}.layout{display:block;}}
</style>
</head>

<div class="gate" id="gate">

  </div>
</div>

      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 17v3h16v-3"/></svg>Download backup</button>

</div>

<div class="scrim" id="scrim"></div>

(function(){
'use strict';
/* ================= data ================= */
function readJSON(id){ return JSON.parse(document.getElementById(id).textContent); }
var DATA = { thai:[], intl:[], smoked:[], venues:[], buyers:[] };
var META = readJSON('data-meta');

/* ================= helpers ================= */
function esc(s){ return (s===undefined||s===null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function uid(){ return Math.random().toString(16).slice(2,10); }

function hash(s){ var h=0; s=s||''; for(var i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))>>>0; } return h; }
function initials(n){
  n=(n||'').replace(/[^\p{L}\p{N}\s]/gu,' ').trim();

    if(s[i].platform==='Instagram' && s[i].label!=='Chef'){
      var v=(s[i].value||'').trim(); var m=v.match(/instagram\.com\/([A-Za-z0-9_.]+)/);
      return m?m[1]:v.replace(/^@/,'');
    }
  }
  return '';

var PLATFORMS=['Instagram','Facebook','TikTok','LINE','WhatsApp','X / Twitter','YouTube','Website','Other'];
function socialUrl(p,v){
  if(!v) return ''; v=String(v).trim();
  if(/^https?:\/\//i.test(v)) return v;
  var h=v.replace(/^@/,'');
  switch(p){
    case 'Instagram': return 'https://www.instagram.com/'+encodeURIComponent(h)+'/';
    case 'Facebook': return /facebook\.com/.test(v)?'https://'+v.replace(/^\/+/,''):'https://www.facebook.com/'+encodeURIComponent(h);
    case 'TikTok': return 'https://www.tiktok.com/@'+encodeURIComponent(h);
    case 'X / Twitter': return 'https://x.com/'+encodeURIComponent(h);
    case 'YouTube': return 'https://www.youtube.com/@'+encodeURIComponent(h);
    case 'WhatsApp': return 'https://wa.me/'+v.replace(/\D/g,'');
    case 'LINE': return /^@/.test(v)?'https://line.me/R/ti/p/'+encodeURIComponent(v):'';
    case 'Website': return 'https://'+v.replace(/^\/+/,'');
    default: return '';

}
function socialLabel(s){
  var v=(s.value||'').replace(/^https?:\/\/(www\.)?/,'').replace(/\/$/,'');

  if(s.platform==='Facebook') v=v.replace(/^facebook\.com\//,'fb/');
  if(s.platform==='TikTok'){ v='@'+v.replace(/^.*tiktok\.com\/@?/,'').replace(/^@/,''); }
  return v;
}

function followerNum(s){

function isSecretKey(k){
  k=String(k||'').trim(); if(/^sb_secret_/i.test(k)) return true;
  var p=k.split('.'); if(p.length!==3) return false;
  try{ var j=JSON.parse(atob(p[1].replace(/-/g,'+').replace(/_/g,'/'))); return j.role==='service_role'; }catch(e){ return false; }
}
function vkey(list,id){ return list+':'+id; }
function cleanForDb(d){ var o=clone(d); delete o._conflict; return o; }
function errText(e){ if(!e) return 'Unknown error'; if(e.message) return e.message; try{ return JSON.stringify(e); }catch(x){ return String(e); } }
async function loadAll(){
  var all=[], from=0, size=1000;
  for(;;){
    var r=await sb.from('contacts').select('list,id,data,updated_at,updated_by').order('list').order('id').range(from,from+size-1);
    if(r.error) throw r.error;
    all=all.concat(r.data||[]);
    if(!r.data||r.data.length<size) break;
    from+=size;
  }
  ORDER.forEach(function(k){ DATA[k]=[]; });
  VERS={};
  all.forEach(function(row){ if(!DATA[row.list]) return; var d=row.data||{}; d.id=row.id; DATA[row.list].push(d); VERS[vkey(row.list,row.id)]={at:row.updated_at,by:row.updated_by}; });
  ORDER.forEach(function(k){ S.ui[k].sel.forEach(function(id){ if(!DATA[k].some(function(c){return c.id===id;})) S.ui[k].sel.delete(id); }); });
  LOADED=true;
  return all.length;
}
/* save one record. force=true skips the "someone else changed it" check */
async function dbSave(list,d,isNew,force){
  var row=cleanForDb(d), v=VERS[vkey(list,d.id)], r;
  if(isNew){ r=await sb.from('contacts').insert({list:list,id:d.id,data:row}).select('updated_at,updated_by'); }
  else {
    var q=sb.from('contacts').update({data:row}).eq('list',list).eq('id',d.id);
    if(!force && v && v.at) q=q.eq('updated_at',v.at);
    r=await q.select('updated_at,updated_by');
  }
  if(r.error) throw r.error;
  if(!r.data||!r.data.length){ var e=new Error('conflict'); e.conflict=true; throw e; }
  VERS[vkey(list,d.id)]={at:r.data[0].updated_at,by:r.data[0].updated_by};
}
async function dbDelete(list,id){
  var r=await sb.from('contacts').delete().eq('list',list).eq('id',id);
  if(r.error) throw r.error;
  delete VERS[vkey(list,id)];
}
async function dbFetchOne(list,id){
  var r=await sb.from('contacts').select('list,id,data,updated_at,updated_by').eq('list',list).eq('id',id);
  if(r.error) throw r.error;
  return (r.data&&r.data[0])||null;
}
function applyRow(row){
  var arr=DATA[row.list]; if(!arr) return;
  var d=row.data||{}; d.id=row.id;
  var i=arr.findIndex(function(x){return x.id===row.id;});
  if(i>-1) arr[i]=d; else arr.push(d);
  VERS[vkey(row.list,row.id)]={at:row.updated_at,by:row.updated_by};
}
var rtTimer=null;
function scheduleRefresh(){ clearTimeout(rtTimer); rtTimer=setTimeout(function(){ renderTabs(); refresh(); },250); }
function startRealtime(){
  if(RT||!sb.channel) return;
  RT=sb.channel('contacts-live').on('postgres_changes',{event:'*',schema:'public',table:'contacts'},function(p){
    var row=p.new&&p.new.id?p.new:null, old=p.old||{};
    var list=(row&&row.list)||old.list, id=(row&&row.id)||old.id; if(!list||!id) return;
    var mine=VERS[vkey(list,id)];
    if(p.eventType==='DELETE'){
      DATA[list]=(DATA[list]||[]).filter(function(x){return x.id!==id;}); delete VERS[vkey(list,id)]; S.ui[list].sel.delete(id);
      if(S.editingId===id&&S.draftSheet===list) showConflict('deleted');
      scheduleRefresh(); return;
    }
    if(mine&&row.updated_at===mine.at) return;             // our own save echoing back
    if(S.editingId===id&&S.draftSheet===list){ S.pendingRow=row; showConflict('changed',row.updated_by); return; }
    applyRow(row); scheduleRefresh();
    if(row.updated_by&&(!ME||row.updated_by.toLowerCase()!==String(ME.email||'').toLowerCase())) toast((row.updated_by||'Someone')+' updated '+((row.data&&row.data.name)||'a contact'));
  }).subscribe();
}

async function runImport(){

function hay(c){

  (c.tags||[]).forEach(function(t){parts.push(t);}); (c.venues||[]).forEach(function(t){parts.push(t);});
  (c.emails||[]).forEach(function(e){parts.push(e);}); (c.phones||[]).forEach(function(p){parts.push(p.value, p.value.replace(/\D/g,''), p.label);});
  (c.socials||[]).forEach(function(s){parts.push(s.value);}); (c.merged_names||[]).forEach(function(n){parts.push(n);});
  if(c.handle) parts.push(c.handle); (c.platforms||[]).forEach(function(p){parts.push(p);}); if(c.outcome) parts.push(c.outcome); if(c.contact_person) parts.push(c.contact_person);
  (c.campaigns||[]).forEach(function(x){parts.push(x.status,x.note,x.status_th,x.note_th);}); (c.visits||[]).forEach(function(x){parts.push(x.outcome,x.slot,x.contact);});
  return parts.filter(Boolean).join(' ').toLowerCase();
}
function passFacet(c, fc, sel, mode){
  if(!sel||!sel.length) return true;
  var vals=fc.get(c);
  if(mode==='all') return sel.every(function(v){return vals.indexOf(v)>-1;});
  if(mode==='none') return !sel.some(function(v){return vals.indexOf(v)>-1;});
  return sel.some(function(v){return vals.indexOf(v)>-1;});
}
function filtered(sheet, excludeKey, override){
  var s=SHEETS[sheet], u=override||S.ui[sheet];
  var q=(u.search||'').toLowerCase().trim(), toks=q?q.split(/\s+/):[];
  var so=!override&&u.selOnly;
  return DATA[sheet].filter(function(c){
    if(so && !u.sel.has(c.id)) return false;
    if(toks.length){ var h=hay(c); for(var i=0;i<toks.length;i++){ if(h.indexOf(toks[i])===-1) return false; } }
    for(var j=0;j<s.facets.length;j++){
      var fc=s.facets[j]; if(fc.key===excludeKey) continue;
      if(!passFacet(c,fc,u.f[fc.key],u.m[fc.key]||'any')) return false;
    }
    return true;
  });
}

  var q=jobs.slice();
  var saved=0, failed=0;
  function worker(){ var j=q.shift(); if(!j) return Promise.resolve(); return tryOne(j,0).then(function(ok){
      done++; if(ok) got++; btn.textContent='Storing photos '+done+'/'+jobs.length;
      if(ok&&j.dirty) return dbSave(j.list,j.c,false,false).then(function(){ saved++; },function(){ failed++; j.c.avatar=''; j.c.avatar_note=''; });
    }).then(worker); }
  Promise.all([worker(),worker(),worker(),worker()]).then(function(){
    storing=false; btn.disabled=false; btn.textContent='Store photos';
    renderResults();
    toast(got?('Saved '+saved+' photos to the database'+(failed?' ('+failed+' skipped because someone edited those contacts — try again)':'')):'Couldn\'t reach the photo service — check your connection and try again');
  });
}
function saveFile(){
  var out={exported_at:new Date().toISOString(),exported_by:ME&&ME.email,lists:{}};
  ORDER.forEach(function(k){ out.lists[k]=DATA[k]; });
  download(new Blob([JSON.stringify(out,null,1)],{type:'application/json'}),'main_contact_ledger_backup_'+new Date().toISOString().slice(0,10)+'.json');
  toast('Backup downloaded');
}
function download(blob,name){ var u=URL.createObjectURL(blob), a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(u); },300); }
var tt; function toast(m){ var t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(function(){t.classList.remove('show');},2600); }

/* ================= events ================= */
function switchSheet(k){ if(S.sheet===k) return; S.sheet=k; renderAll(); $('results').scrollIntoView&&window.scrollTo({top:0}); }
function goto(ref){ var p=ref.split(':'); closeProfile(); if(S.sheet!==p[0]){ S.sheet=p[0]; renderAll(); } openProfile(p[0],p[1]); }

$('tabs').addEventListener('click',function(e){ var b=e.target.closest('[data-sheet]'); if(b) switchSheet(b.getAttribute('data-sheet')); });
$('tabs').addEventListener('keydown',function(e){ if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft') return; var i=ORDER.indexOf(S.sheet)+(e.key==='ArrowRight'?1:-1); i=(i+ORDER.length)%ORDER.length; switchSheet(ORDER[i]); var b=document.querySelector('.tab.active'); if(b) b.focus(); });

var st; $('search').addEventListener('input',function(e){ clearTimeout(st); var v=e.target.value; st=setTimeout(function(){ ui().search=v; refresh(); },120); });
$('sortSel').addEventListener('change',function(e){ ui().sort=+e.target.value; renderResults(); });
$('vTable').addEventListener('click',function(){ S.view='table'; this.classList.add('on'); $('vCards').classList.remove('on'); renderResults(); });
$('vCards').addEventListener('click',function(){ S.view='cards'; this.classList.add('on'); $('vTable').classList.remove('on'); renderResults(); });
$('exportBtn').addEventListener('click',function(){ exportCSV(ui().sel.size>0); });
$('selExport').addEventListener('click',exportAllSelected);
$('selOnly').addEventListener('click',function(){ ui().selOnly=!ui().selOnly; refresh(); });
$('photosBtn').addEventListener('click',storePhotos);
$('selCount').addEventListener('click',function(e){ var b=e.target.closest('[data-selsheet]'); if(b) switchSheet(b.getAttribute('data-selsheet')); });
$('selClear').addEventListener('click',function(){ ORDER.forEach(function(k){ S.ui[k].sel.clear(); S.ui[k].selOnly=false; }); refresh(); toast('Selection cleared on all lists'); });
$('selCopy').addEventListener('click',copyAllEmails);
$('saveFileBtn').addEventListener('click',saveFile);
$('signOutBtn').addEventListener('click',signOut);
$('refreshBtn').addEventListener('click',async function(){ var b=this; b.disabled=true; b.textContent='Refreshing…'; try{ await loadAll(); renderAll(); toast('Up to date'); }catch(e){ toast('Refresh failed — '+errText(e)); } b.disabled=false; b.textContent='Refresh'; });
$('addBtn').addEventListener('click',function(){ openEditor(S.sheet,null); });
$('filtersToggle').addEventListener('click',function(){ $('sidebar').classList.toggle('open'); $('scrim').classList.toggle('open',$('sidebar').classList.contains('open')); });

$('sidebar').addEventListener('change',function(e){
  var t=e.target, k=t.getAttribute('data-fkey'); if(!k) return;
  var u=ui(), arr=(u.f[k]||[]).slice(), v=t.value;
  if(t.checked){ if(arr.indexOf(v)<0) arr.push(v); } else arr=arr.filter(function(x){return x!==v;});
  u.f[k]=arr; if(!arr.length) delete u.f[k];
  refresh();
});
$('sidebar').addEventListener('input',function(e){ var k=e.target.getAttribute('data-fsearch'); if(!k) return; ui().expanded['q_'+k]=e.target.value; renderSidebar(); });
$('sidebar').addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b) return; var u=ui();
  if(b.hasAttribute('data-preset')){ var p=sh().presets[+b.getAttribute('data-preset')]; u.f=clone(pf(p)); u.m=clone(p.m||{}); u.search=''; $('search').value=''; refresh(); if(window.innerWidth<=980){ $('sidebar').classList.remove('open'); $('scrim').classList.remove('open'); } return; }
  if(b.hasAttribute('data-mode')){ var k=b.getAttribute('data-key'); u.m[k]=b.getAttribute('data-mode'); if(u.m[k]==='any') delete u.m[k]; refresh(); return; }
  var a=b.getAttribute('data-act'), key=b.getAttribute('data-key');
  if(a==='toggle-facet'){ var fEl=b.closest('.facet'); u.collapsed[key]=!fEl.classList.contains('collapsed'); fEl.classList.toggle('collapsed'); b.setAttribute('aria-expanded',!u.collapsed[key]); }
  else if(a==='more'){ u.expanded[key]=!u.expanded[key]; renderSidebar(); }
  else if(a==='clear-filters'){ u.f={}; u.m={}; refresh(); }
});

$('summary').addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b) return; var u=ui();
  if(b.hasAttribute('data-unchip')){ var k=b.getAttribute('data-unchip'), v=b.getAttribute('data-val'); u.f[k]=(u.f[k]||[]).filter(function(x){return x!==v;}); if(!u.f[k].length){ delete u.f[k]; delete u.m[k]; } refresh(); }
  else if(b.getAttribute('data-act')==='sel-only-off'){ u.selOnly=false; refresh(); }
  else if(b.getAttribute('data-act')==='clear-search'){ u.search=''; $('search').value=''; refresh(); }
  else if(b.getAttribute('data-act')==='clear-all'){ u.f={}; u.m={}; u.search=''; $('search').value=''; refresh(); }
});

$('results').addEventListener('click',function(e){
  var t=e.target, u=ui();
  if(t.matches('input[type=checkbox]')) return;
  if(t.closest('[data-stop]')) return;
  var g=t.closest('[data-goto]'); if(g){ e.stopPropagation(); goto(g.getAttribute('data-goto')); return; }
  var b=t.closest('[data-act]');
  if(b){
    var a=b.getAttribute('data-act'), id=b.getAttribute('data-id');
    if(a==='edit'){ openEditor(S.sheet,id); return; }
    if(a==='open'){ var l=firstLink(byId(S.sheet,id)); if(l) window.open(l,'_blank','noopener'); return; }
    if(a==='clear-all'){ u.f={}; u.m={}; u.search=''; $('search').value=''; refresh(); return; }
    return;
  }
  var row=t.closest('[data-id]'); if(row) openProfile(S.sheet,row.getAttribute('data-id'));
});
$('results').addEventListener('change',function(e){
  var t=e.target, u=ui();
  if(t.getAttribute('data-act')==='sel-all'){ results().forEach(function(c){ t.checked?u.sel.add(c.id):u.sel.delete(c.id); }); renderResults(); return; }
  var id=t.getAttribute('data-sel'); if(!id) return;
  t.checked?u.sel.add(id):u.sel.delete(id);
  var host=t.closest('tr,.card'); if(host) host.classList.toggle('selected',t.checked);
  updateSel();
});
$('results').addEventListener('click',function(e){ var th=e.target.closest('th[data-sortidx]'); if(th){ ui().sort=+th.getAttribute('data-sortidx'); renderSorts(); renderResults(); } });

$('mScrim').addEventListener('click',function(e){
  if(e.target.id==='mScrim'){ closeProfile(); return; }
  var b=e.target.closest('button'); if(!b) return;
  if(b.getAttribute('data-act')==='close-modal') closeProfile();
  else if(b.getAttribute('data-act')==='edit-from-modal') openEditor(b.getAttribute('data-sheet'),b.getAttribute('data-id'));
  else if(b.hasAttribute('data-copy')) copyText(b.getAttribute('data-copy'));
  else if(b.hasAttribute('data-goto')) goto(b.getAttribute('data-goto'));
});

$('scrim').addEventListener('click',function(){ if($('drawer').classList.contains('open')) closeEditor(); $('sidebar').classList.remove('open'); $('scrim').classList.remove('open'); });
$('dClose').addEventListener('click',closeEditor);
$('dFoot').addEventListener('click',function(e){
  var b=e.target.closest('[data-act]'); if(!b) return; var a=b.getAttribute('data-act');
  if(a==='save') saveEditor(); else if(a==='cancel') closeEditor(); else if(a==='delete') askDelete();
  else if(a==='keep') $('dFoot').innerHTML=footerHtml(false); else if(a==='confirm-delete') doDelete();
});
function draftSet(el){
  var d=S.draft; if(!d) return;
  var k=el.getAttribute('data-k'); if(k){ d[k]=el.value; return; }
  var arr=el.getAttribute('data-arr'); if(arr){ var i=+el.getAttribute('data-i'), sub=el.getAttribute('data-sub'); if(sub) d[arr][i][sub]=el.value; else d[arr][i]=el.value; }
}
$('dBody').addEventListener('input',function(e){ draftSet(e.target); });
$('dBody').addEventListener('change',function(e){ draftSet(e.target); });
$('dBody').addEventListener('keydown',function(e){
  var k=e.target.getAttribute('data-tagin'); if(!k) return;
  if(e.key==='Enter'||e.key===','){ e.preventDefault(); var v=e.target.value.trim().replace(/,$/,''); if(v&&S.draft[k].indexOf(v)<0){ S.draft[k].push(v); } renderDrawer(); var n=document.querySelector('[data-tagin="'+k+'"]'); if(n) n.focus(); }
  else if(e.key==='Backspace'&&!e.target.value&&S.draft[k].length){ S.draft[k].pop(); renderDrawer(); var n2=document.querySelector('[data-tagin="'+k+'"]'); if(n2) n2.focus(); }
});
$('dBody').addEventListener('focusout',function(e){ var k=e.target.getAttribute&&e.target.getAttribute('data-tagin'); if(k&&e.target.value.trim()){ var v=e.target.value.trim(); if(S.draft[k].indexOf(v)<0) S.draft[k].push(v); e.target.value=''; setTimeout(renderDrawer,0); } });
$('dBody').addEventListener('click',function(e){
  var b=e.target.closest('[data-add],[data-rm],[data-rm-tag],[data-act],[data-rm-flag]'); if(!b) return; var d=S.draft;
  if(b.hasAttribute('data-add')){ var k=b.getAttribute('data-add'); d[k].push(k==='phones'?{label:'',value:''}:k==='socials'?{platform:'Instagram',value:''}:''); renderDrawer(); var ins=document.querySelectorAll('[data-arr="'+k+'"]'); if(ins.length) ins[ins.length-1].focus(); return; }
  if(b.hasAttribute('data-rm')){ d[b.getAttribute('data-rm')].splice(+b.getAttribute('data-i'),1); renderDrawer(); return; }
  if(b.hasAttribute('data-rm-tag')){ d[b.getAttribute('data-rm-tag')].splice(+b.getAttribute('data-i'),1); renderDrawer(); return; }
  if(b.hasAttribute('data-rm-flag')){ d.flags.splice(+b.getAttribute('data-rm-flag'),1); renderDrawer(); toast('Flag cleared — save to keep this'); return; }
  var a=b.getAttribute('data-act');
  if(a==='load-theirs'){ if(S.pendingRow){ applyRow(S.pendingRow); var id=S.pendingRow.id, l=S.pendingRow.list; S.pendingRow=null; closeEditor(); renderAll(); openEditor(l,id); toast('Loaded the latest version'); } return; }
  if(a==='save-mine'){ S.pendingRow=null; var bx=$('dBody').querySelector('.conflict'); if(bx) bx.remove(); persistDraft(S.draft,true); return; }
  if(a==='upload') $('fileIn').click();
  else if(a==='rm-avatar'){ d.avatar=''; renderDrawer(); }
});
$('fileIn').addEventListener('change',function(e){ var f=e.target.files[0]; if(!f||!S.draft) return; resizeImage(f,function(u){ S.draft.avatar=u; S.draft.avatar_note='Uploaded'; renderDrawer(); toast('Photo added — save to keep it'); }); e.target.value=''; });

document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){ if($('mScrim').classList.contains('open')) closeProfile(); else if($('drawer').classList.contains('open')) closeEditor(); else if($('sidebar').classList.contains('open')){ $('sidebar').classList.remove('open'); $('scrim').classList.remove('open'); } }
  if(e.key==='/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){ e.preventDefault(); $('search').focus(); }
});

boot();
})();

</script>
